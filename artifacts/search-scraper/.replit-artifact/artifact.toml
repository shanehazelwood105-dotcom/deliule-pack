kind = "web"
previewPath = "/search-scraper/"
title = "Search Scraper"
version = "1.0.0"
id = "artifacts/search-scraper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/search-scraper/" ]
localPort = 20007

[services.development]
run = "pnpm --filter @workspace/search-scraper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/search-scraper", "run", "build" ]
publicDir = "artifacts/search-scraper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20007"
BASE_PATH = "/search-scraper/"
